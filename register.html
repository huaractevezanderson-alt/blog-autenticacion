<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <form id="registerForm" class="formulario">

            <h2>Crear Cuenta</h2>

            <input
                type="text"
                id="username"
                placeholder="Usuario"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Correo"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Contraseña"
                required
            >

            <button type="submit">
                Registrarse
            </button>

            <p>
                ¿Ya tienes cuenta?
                <a href="login.html">
                    Iniciar sesión
                </a>
            </p>

        </form>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
